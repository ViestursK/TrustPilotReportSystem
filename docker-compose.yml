services:
  postgres:
    image: postgres:15-alpine
    container_name: trustpilot_postgres
    environment:
      POSTGRES_DB: trustpilot_db
      POSTGRES_USER: trustpilot_user
      POSTGRES_PASSWORD: trustpilot_pass
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustpilot_user -d trustpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
